version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    # #113: charset-normalizer 3.5.x misdetects short Big5 as shift_jis; pyproject caps it.
    ignore:
      - dependency-name: "charset-normalizer"
        versions: [">=3.5"]
    groups:
      uv:
        patterns:
          - "*"
